# Qwen3-4B hybrid-model paired pilot, sampled per official Qwen3 recommendations.
# This v2 protocol is NOT interchangeable with the earlier greedy v1 smoke.
model_path: /data1/lmy/models/Qwen3-4B
dataset: data/processed/pilot.jsonl
seed: 42
modes: [fast, slow]
decode:
  do_sample: true
  max_new_tokens: 4096
  sampling:
    fast:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
    slow:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
