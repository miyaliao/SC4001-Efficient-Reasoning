# Qwen3-1.7B matched mixed benchmark; same prompt/data/seed/decode as 4B.
# Keep results separate from outputs/mixed-boxed-v1.
model_path: /data1/lmy/models/Qwen3-1.7B
dataset: data/processed/mixed_eval_v1.jsonl
seed: 42
modes: [fast, slow]
decode:
  do_sample: true
  max_new_tokens: 4096
  sampling:
    fast:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
    slow:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
